name: Build IPA

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# A newer push to the same branch supersedes the one still running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap Linux job: unit tests for the logic in Shared/. The macOS build only starts if these pass.
  test:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

  build:
    needs: test
    # Only main (or a manual run) spends macOS minutes; other branches stop after the tests.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project Hastify.xcodeproj \
            -scheme Hastify \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # Ad-hoc sign so the App Group entitlements are embedded; SideStore/AltStore
      # read them when re-signing with your Apple ID.
      - name: Embed entitlements and package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Hastify.app
          codesign -f -s - --entitlements Widget/HastifyWidget.entitlements "$APP/PlugIns/HastifyWidget.appex"
          codesign -f -s - --entitlements App/Hastify.entitlements "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Hastify.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Hastify-ipa
          path: Hastify.ipa
