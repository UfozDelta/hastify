name: Hastify
options:
  bundleIdPrefix: com.hastify
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Hastify:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hastify
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: App/Hastify.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hastify.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hastify.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: HastifyWidget
  HastifyWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Hastify Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/HastifyWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hastify.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hastify.app.widget
schemes:
  Hastify:
    build:
      targets:
        Hastify: all
        HastifyWidget: all
